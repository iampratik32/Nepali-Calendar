name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Optional signing. Without these secrets the release APK is signed with the runner's
      # throwaway debug key, so each build has a different signature: you'd have to uninstall
      # before installing a newer build. See README → "Signing".
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.PATRO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/patro.jks"
            echo "PATRO_KEYSTORE=$RUNNER_TEMP/patro.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::PATRO_KEYSTORE_BASE64 not set; release APK is signed with a throwaway debug key."
          fi

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build release APK
        env:
          PATRO_KEYSTORE_PASSWORD: ${{ secrets.PATRO_KEYSTORE_PASSWORD }}
          PATRO_KEY_ALIAS: ${{ secrets.PATRO_KEY_ALIAS }}
          PATRO_KEY_PASSWORD: ${{ secrets.PATRO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: APK size
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          bytes=$(stat -c %s "$apk")
          echo "$apk: $bytes bytes"
          {
            echo "### Release APK"
            echo "\`$(basename "$apk")\`: **$((bytes / 1024)) KiB** ($bytes bytes)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: patro-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
